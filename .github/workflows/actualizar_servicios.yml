name: Actualizar datos Agenda Tucumán

on:
  workflow_dispatch:
  schedule:
    # Ejecutar todos los días a las 08:17 de Tucumán (UTC-3).
    - cron: '17 11 * * *'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Extraer TODOS los Servicios
        working-directory: app
        run: python extractores/servicios.py

      - name: Filtrar Servicios con Gemini (1 vez al día)
        working-directory: app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python scripts/filtrar-servicios-ia.py

      - name: Validar JSON de Servicios
        working-directory: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['datos/servicios_raw.json', 'datos/servicios_tucuman.json']:
              p=Path(name)
              data=json.loads(p.read_text(encoding='utf-8'))
              print(f'OK {name}: {p.stat().st_size} bytes')
              if name.endswith('servicios_tucuman.json'):
                  print('Servicios publicados:', data.get('count', 0))
          PY

      - name: Publicar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/datos/servicios_raw.json app/datos/servicios_tucuman.json
          if git diff --cached --quiet; then
            echo "Sin cambios en Servicios."
          else
            git commit -m "Actualizar Servicios de Agenda Tucumán"
            git push
          fi
