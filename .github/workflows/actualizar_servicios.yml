name: Actualizar Servicios Agenda Tucumán

on:
  workflow_dispatch:
  schedule:
    # Cada 2 horas. Solo se revisan las 3 páginas más recientes. Gemini procesa como máximo 50 artículos por corrida.
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Extraer TODOS los Servicios
        run: python -u extractores/servicios.py

      - name: Verificar extracción
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('datos/servicios_raw.json')
          if not p.exists():
              raise SystemExit('No existe datos/servicios_raw.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          articles = data.get('articles', []) if isinstance(data, dict) else data
          print(f'Artículos extraídos: {len(articles)}')
          if not isinstance(articles, list):
              raise SystemExit('Formato inválido de servicios_raw.json')
          if not articles:
              raise SystemExit('servicios_raw.json está vacío; no se continúa con Gemini')
          PY

      - name: Filtrar hasta 50 Servicios con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
        run: python -u scripts/filtrar-servicios-ia.py

      - name: Validar JSON de Servicios
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['datos/servicios_raw.json', 'datos/servicios_tucuman.json', 'datos/servicios_gemini_state.json']:
              p = Path(name)
              if not p.exists():
                  raise SystemExit(f'Falta {name}')
              data = json.loads(p.read_text(encoding='utf-8'))
              print(f'OK {name}: {p.stat().st_size} bytes')
              if name.endswith('servicios_tucuman.json'):
                  print('Servicios publicados:', data.get('count', 0))
              if name.endswith('servicios_gemini_state.json'):
                  print('IDs procesados:', len(data.get('processed', {})))
                  print('IDs seleccionados:', len(data.get('selected_ids', [])))
          PY

      - name: Publicar datos y estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/servicios_raw.json datos/servicios_tucuman.json datos/servicios_gemini_state.json
          if git diff --cached --quiet; then
            echo "Sin cambios en Servicios."
          else
            git commit -m "Actualizar Servicios de Agenda Tucumán"
            git push
          fi
