name: Actualizar datos Agenda Tucumán

on:
  workflow_dispatch:
  schedule:
    # Cada 6 horas. GitHub usa UTC.
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r extractores/requirements.txt

      # ============================================================
      # AGENDA
      # ============================================================

      - name: Extraer agenda MEC
        id: agenda
        continue-on-error: true
        run: |
          mkdir -p .tmp/agenda

          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)

          python extractores/agenda_mec.py \
            --start-year "$YEAR" \
            --start-month "$MONTH" \
            --months 12 \
            --lookback-months 2 \
            --delay 0.15 \
            --out .tmp/agenda

      - name: Publicar agenda
        if: steps.agenda.outcome == 'success'
        run: |
          if [ -f ".tmp/agenda/agenda_eventos.json" ]; then
            cp .tmp/agenda/agenda_eventos.json datos/agenda_eventos.json
            echo "✓ Agenda actualizada correctamente."
          else
            echo "ERROR: el extractor terminó correctamente pero no generó agenda_eventos.json."
            exit 1
          fi

      - name: Informar error de agenda
        if: steps.agenda.outcome != 'success'
        run: |
          echo "ERROR: no se pudo actualizar la agenda."
          echo "Se conservarán los datos anteriores."


      # ============================================================
      # RADIO / CONTENIDOS
      # ============================================================

      - name: Extraer contenidos y radio
        id: radio
        continue-on-error: true
        run: |
          mkdir -p .tmp/contenidos
          cd .tmp/contenidos

          python ../../extractores/contenidos.py

      - name: Validar y publicar radio/contenidos
        if: steps.radio.outcome == 'success'
        run: |
          if [ -f ".tmp/contenidos/radio_tucuman.json" ]; then
            cp .tmp/contenidos/radio_tucuman.json datos/radio_tucuman.json
            echo "Radio actualizada correctamente."
          else
            echo "ADVERTENCIA: no se generó radio_tucuman.json."
          fi

      - name: Publicar cine de Agenda
        if: steps.radio.outcome == 'success'
        run: |
          if [ -f ".tmp/contenidos/cine_tucuman.json" ]; then
            cp .tmp/contenidos/cine_tucuman.json datos/cine_tucuman.json
            echo "Cine de Agenda actualizado correctamente."
          else
            echo "ADVERTENCIA: no se generó cine_tucuman.json."
          fi

      - name: Informar error de radio
        if: steps.radio.outcome != 'success'
        run: |
          echo "ADVERTENCIA: no se pudo actualizar Radio/Contenidos."
          echo "Se conservarán los datos anteriores."

      # ============================================================
      # CINEMACENTER
      # ============================================================

      - name: Extraer Cinemacenter Tucumán
        id: cinemacenter
        continue-on-error: true
        run: |
          mkdir -p .tmp/cinemacenter
          cd .tmp/cinemacenter

          PYTHONUNBUFFERED=1 python -u ../../extractores/cinemacenter.py

      - name: Validar vigencia de Cinemacenter
        id: validate_cinemacenter
        if: steps.cinemacenter.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import date
          from pathlib import Path

          path = Path('.tmp/cinemacenter/cine_cinemacenter_tucuman.json')
          if not path.exists():
              print('ERROR: no se generó cine_cinemacenter_tucuman.json.')
              sys.exit(1)

          data = json.loads(path.read_text(encoding='utf-8'))
          cartelera = data.get('cartelera') or {}
          week_start = cartelera.get('week_start')
          week_end = cartelera.get('week_end')
          today = date.today().isoformat()

          print(f'Fecha del runner: {today}')
          print(f'Semana detectada: {week_start} -> {week_end}')

          if not week_start or not week_end:
              print('ERROR: la cartelera no contiene week_start/week_end.')
              sys.exit(1)

          if week_end < today:
              print('ERROR: Cinemacenter devolvió una cartelera vencida.')
              print('No se reemplazarán los datos publicados anteriormente.')
              sys.exit(1)

          if week_start > today:
              print('ADVERTENCIA: Cinemacenter devolvió una cartelera futura.')

          movies = cartelera.get('movies') or []
          if not movies:
              print('ERROR: la cartelera vigente no contiene películas.')
              sys.exit(1)

          print(f'✓ Cartelera vigente aceptada: {len(movies)} películas.')
          PY

      - name: Publicar Cinemacenter
        if: steps.cinemacenter.outcome == 'success' && steps.validate_cinemacenter.outcome == 'success'
        run: |
          if [ -f ".tmp/cinemacenter/cine_cinemacenter_tucuman.json" ]; then
            cp .tmp/cinemacenter/cine_cinemacenter_tucuman.json datos/cine_cinemacenter_tucuman.json
            echo "Cinemacenter actualizado correctamente."
          else
            echo "ADVERTENCIA: no se generó cine_cinemacenter_tucuman.json."
          fi

      - name: Informar estado de Cinemacenter
        if: steps.cinemacenter.outcome != 'success' || steps.validate_cinemacenter.outcome != 'success'
        run: |
          if [ "${{ steps.cinemacenter.outcome }}" != "success" ]; then
            echo "ADVERTENCIA: Cinemacenter no respondió."
          else
            echo "ADVERTENCIA: la cartelera obtenida no fue aceptada como vigente."
          fi
          echo "Se conservará la cartelera anterior."

      # ============================================================
      # METADATA DETALLADA DE CINEMACENTER
      # Se ejecuta después de publicar la cartelera nueva para que la
      # metadata siempre corresponda a las películas recién extraídas.
      # ============================================================

      - name: Preparar cartelera para enriquecimiento Cinemacenter
        if: steps.validate_cinemacenter.outcome == 'success'
        run: |
          if [ -f "datos/cine_cinemacenter_tucuman.json" ]; then
            cp datos/cine_cinemacenter_tucuman.json src/data/cine_cinemacenter_tucuman.json
            echo "Cartelera Cinemacenter sincronizada con src/data/."
          else
            echo "No hay una cartelera nueva; se utilizará la versión local anterior."
          fi

      - name: Enriquecer metadata de Cinemacenter
        id: cine_metadata
        if: steps.validate_cinemacenter.outcome == 'success'
        continue-on-error: true
        env:
          # Cinemacenter puede bloquear o ralentizar el acceso desde GitHub.
          # Jina Reader accede a la página; la fuente de los datos sigue siendo Cinemacenter.
          CINEMACENTER_FETCH_MODE: jina
          CINEMACENTER_READER_TIMEOUT: '60'
          PYTHONUNBUFFERED: '1'
        run: python scripts/enrich-cinemacenter-metadata.py

      - name: Informar estado de metadata Cinemacenter
        if: steps.cine_metadata.outcome != 'success'
        run: |
          echo "ADVERTENCIA: no se pudo actualizar la metadata de Cinemacenter."
          echo "Se conservará la metadata disponible anteriormente."

      # ============================================================
      # INFORMACIÓN DETALLADA DE PELÍCULAS
      # ============================================================

      - name: Enriquecer películas con TMDB
        id: peliculas
        if: steps.validate_cinemacenter.outcome == 'success'
        continue-on-error: true
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          if [ -z "$TMDB_API_TOKEN" ]; then
            echo "ADVERTENCIA: no existe el secret TMDB_API_TOKEN."
            echo "Se conserva la información cinematográfica anterior."
            exit 0
          fi

          python extractores/peliculas_tmdb.py

      - name: Informar estado de películas
        if: steps.peliculas.outcome != 'success'
        run: |
          echo "ADVERTENCIA: no se pudo actualizar la información cinematográfica."
          echo "Se conservará la versión anterior de datos/agenda_peliculas.json."

      # ============================================================
      # VALIDACIÓN GENERAL DE JSON PUBLICADOS
      # ============================================================

      - name: Validar JSON publicados
        id: json_validation
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          files = [
              "datos/agenda_eventos.json",
              "datos/cine_tucuman.json",
              "datos/radio_tucuman.json",
              "datos/cine_cinemacenter_tucuman.json",
              "datos/cine_metadata.json",
              "src/data/cine_cinemacenter_tucuman.json",
              "src/data/cine_metadata.json",
              "datos/agenda_peliculas.json",
          ]

          failed = False

          print("")
          print("=" * 70)
          print("VALIDACIÓN DE JSON PUBLICADOS")
          print("=" * 70)

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  print(f"⚠ {filename}: no existe; se conserva la versión anterior.")
                  continue

              try:
                  with path.open(encoding="utf-8") as f:
                      data = json.load(f)

                  print(f"✓ {filename}: JSON válido")

                  if filename.endswith("agenda_eventos.json") and isinstance(data, list):
                      print(f"  Eventos publicados: {len(data)}")
              except Exception as e:
                  print(f"✗ {filename}: ERROR - {e}")
                  failed = True

          if failed:
              sys.exit(1)

          print("=" * 70)
          PY

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Guardar cambios
        if: steps.json_validation.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datos/ src/data/cine_cinemacenter_tucuman.json src/data/cine_metadata.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos en los datos."
          else
            git commit -m "Actualizar datos de Agenda Tucumán"
            git push
            echo "Datos publicados correctamente."
          fi

      # ============================================================
      # FALLAR EL WORKFLOW SI HUBO UN PROBLEMA CRÍTICO
      # Esto hace que GitHub lo marque como FAILED y active las
      # notificaciones normales de GitHub Actions.
      # ============================================================

      - name: Estado final
        if: always()
        run: |
          echo ""
          echo "============================================================"
          echo "ESTADO FINAL"
          echo "============================================================"

          if [ "${{ steps.agenda.outcome }}" = "success" ]; then
            echo "✓ Agenda MEC: OK"
          else
            echo "✗ Agenda MEC: ERROR"
          fi

          if [ "${{ steps.radio.outcome }}" = "success" ]; then
            echo "✓ Radio/Contenidos: OK"
          else
            echo "⚠ Radio/Contenidos: no actualizado"
          fi

          if [ "${{ steps.cinemacenter.outcome }}" = "success" ] && [ "${{ steps.validate_cinemacenter.outcome }}" = "success" ]; then
            echo "✓ Cinemacenter: OK y cartelera vigente"
          else
            echo "⚠ Cinemacenter: no actualizado / cartelera anterior conservada"
          fi

          if [ "${{ steps.cine_metadata.outcome }}" = "success" ]; then
            echo "✓ Metadata Cinemacenter: OK"
          else
            echo "⚠ Metadata Cinemacenter: no actualizada"
          fi

          echo ""
          echo "Si un extractor falla, se conservan sus datos anteriores."
          echo "La Agenda se publica exactamente con el resultado generado por el extractor."
          echo "============================================================"

          if [ "${{ steps.agenda.outcome }}" != "success" ] || \
             [ "${{ steps.json_validation.outcome }}" != "success" ]; then
            exit 1
          fi
