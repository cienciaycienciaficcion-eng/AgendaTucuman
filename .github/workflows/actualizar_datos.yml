name: Actualizar datos Agenda Tucumán

on:
  workflow_dispatch:
  schedule:
    # Cada 6 horas. GitHub usa UTC.
    - cron: "17 */6 * * *"

permissions:
  contents: write

env:
  TZ: America/Argentina/Tucuman

jobs:
  actualizar:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r extractores/requirements.txt

      # ============================================================
      # AGENDA
      # ============================================================
      - name: Extraer agenda MEC
        id: agenda
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          mkdir -p .tmp/agenda

          YEAR=$(TZ=America/Argentina/Tucuman date +%Y)
          MONTH=$(TZ=America/Argentina/Tucuman date +%m)
          HOUR=$(TZ=America/Argentina/Tucuman date +%H)

          if [ "$HOUR" = "08" ]; then
            GEMINI_ENABLED=1 python -u extractores/agenda_mec_ia.py \
              --start-year "$YEAR" \
              --start-month "$MONTH" \
              --months 12 \
              --lookback-months 2 \
              --delay 0.15 \
              --out .tmp/agenda
          else
            GEMINI_ENABLED=0 python -u extractores/agenda_mec_ia.py \
              --start-year "$YEAR" \
              --start-month "$MONTH" \
              --months 12 \
              --lookback-months 2 \
              --delay 0.15 \
              --out .tmp/agenda
          fi

          test -s .tmp/agenda/agenda_eventos.json

      - name: Filtrar ventana de Agenda y excluir Servicios
        id: filter_agenda
        if: steps.agenda.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          path = Path(".tmp/agenda/agenda_eventos.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(data, list):
              raise SystemExit("ERROR: agenda_eventos.json no contiene una lista")

          today = datetime.now(ZoneInfo("America/Argentina/Tucuman")).date()
          cutoff = today - timedelta(days=15)

          kept = []
          removed_old = 0
          removed_services = 0
          removed_invalid = 0

          for event in data:
              if not isinstance(event, dict):
                  removed_invalid += 1
                  continue

              categories = event.get("categories") or []
              categories_text = " ".join(
                  str(c).strip().lower() for c in categories
              )
              source = str(event.get("source") or "").strip().lower()

              if "servicios" in categories_text or "servicios" in source:
                  removed_services += 1
                  continue

              start_raw = str(event.get("date_start") or "").strip()[:10]
              if not start_raw:
                  removed_invalid += 1
                  continue

              try:
                  start_date = datetime.fromisoformat(start_raw).date()
              except ValueError:
                  removed_invalid += 1
                  continue

              if start_date < cutoff:
                  removed_old += 1
                  continue

              kept.append(event)

          path.write_text(
              json.dumps(kept, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"Fecha Tucumán: {today.isoformat()}")
          print(f"Ventana mínima: {cutoff.isoformat()}")
          print(f"Eventos originales: {len(data)}")
          print(f"Eventos publicados: {len(kept)}")
          print(f"Eliminados por fecha: {removed_old}")
          print(f"Eliminados por Servicios: {removed_services}")
          print(f"Eliminados por fecha inválida/sin fecha: {removed_invalid}")

          if not kept:
              raise SystemExit("ERROR: el filtro dejó la Agenda sin eventos")
          PY

      - name: Validar agenda
        id: validate_agenda
        if: steps.filter_agenda.outcome == 'success'
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          p = Path(".tmp/agenda/agenda_eventos.json")
          if not p.exists():
              sys.exit("ERROR: no existe agenda_eventos.json")

          data = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(data, list) or not data:
              sys.exit("ERROR: agenda vacía o inválida")

          today = datetime.now(
              ZoneInfo("America/Argentina/Tucuman")
          ).date()
          cutoff = today - timedelta(days=15)

          invalid = []
          for e in data:
              start_raw = str(e.get("date_start") or "").strip()[:10]
              try:
                  start = datetime.fromisoformat(start_raw).date()
              except Exception:
                  invalid.append(e.get("id"))
                  continue

              categories = " ".join(
                  str(c).lower() for c in (e.get("categories") or [])
              )
              source = str(e.get("source") or "").lower()

              if start < cutoff:
                  invalid.append(e.get("id"))
              elif "servicios" in categories or "servicios" in source:
                  invalid.append(e.get("id"))

          print(f"Fecha Tucumán: {today.isoformat()}")
          print(f"Ventana mínima: {cutoff.isoformat()}")
          print(f"Eventos publicados: {len(data)}")
          print(f"Eventos fuera de regla: {len(invalid)}")

          if invalid:
              sys.exit(
                  "ERROR: el JSON publicado todavía contiene eventos "
                  "anteriores a today-15 o de Servicios"
              )
          PY

      - name: Generar resúmenes con Gemini
        id: gemini
        if: steps.validate_agenda.outcome == 'success'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python scripts/generar_resumenes_gemini.py \
            --input .tmp/agenda/agenda_eventos.json \
            --previous datos/agenda_eventos.json \
            --output .tmp/agenda/agenda_eventos.json

      - name: Publicar agenda
        if: steps.validate_agenda.outcome == 'success'
        run: cp .tmp/agenda/agenda_eventos.json datos/agenda_eventos.json

      # ============================================================
      # RADIO / CONTENIDOS
      # ============================================================
      - name: Extraer contenidos y radio
        id: radio
        continue-on-error: true
        run: |
          mkdir -p .tmp/contenidos
          cd .tmp/contenidos
          python ../../extractores/contenidos.py

      - name: Publicar radio
        if: steps.radio.outcome == 'success'
        run: |
          if [ -f ".tmp/contenidos/radio_tucuman.json" ]; then
            cp .tmp/contenidos/radio_tucuman.json datos/radio_tucuman.json
          fi

      - name: Publicar cine de Agenda
        if: steps.radio.outcome == 'success'
        run: |
          if [ -f ".tmp/contenidos/cine_tucuman.json" ]; then
            cp .tmp/contenidos/cine_tucuman.json datos/cine_tucuman.json
          fi

      # ============================================================
      # CINEMACENTER
      #
      # CAMBIO IMPORTANTE:
      # Ya NO depende del jueves.
      #
      # Se intenta actualizar en TODAS las corridas (cada 6 horas).
      # Si falla, si devuelve una cartelera vencida, vacía o
      # incompleta, NO se reemplaza la cartelera anterior.
      #
      # De esta forma:
      #   - normalmente se actualiza varias veces por día;
      #   - si Cinemacenter publica estrenos antes del jueves,
      #     podemos capturarlos;
      #   - si el jueves falla, se vuelve a intentar en la próxima
      #     corrida;
      #   - nunca se borra una cartelera válida por un fallo puntual.
      # ============================================================
      - name: Extraer Cinemacenter Tucumán
        id: cinemacenter
        continue-on-error: true
        run: |
          mkdir -p .tmp/cinemacenter
          cd .tmp/cinemacenter
          PYTHONUNBUFFERED=1 python -u ../../extractores/cinemacenter.py

      - name: Conservar próximos estrenos si Cinemacenter responde vacío
        if: steps.cinemacenter.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          current_path = Path(".tmp/cinemacenter/cine_cinemacenter_tucuman.json")
          previous_path = Path("datos/cine_cinemacenter_tucuman.json")
          current_meta_path = Path(".tmp/cinemacenter/cine_metadata.json")
          previous_meta_path = Path("datos/cine_metadata.json")

          if not current_path.exists() or not previous_path.exists():
              raise SystemExit(0)

          current = json.loads(current_path.read_text(encoding="utf-8"))
          previous = json.loads(previous_path.read_text(encoding="utf-8"))
          current_upcoming = current.get("proximos_estrenos") or []
          previous_upcoming = previous.get("proximos_estrenos") or []

          if current_upcoming or not previous_upcoming:
              print(f"Próximos estrenos actuales: {len(current_upcoming)}")
              raise SystemExit(0)

          print(f"Cinemacenter devolvió 0 próximos estrenos; se conservan {len(previous_upcoming)} anteriores.")
          current["proximos_estrenos"] = previous_upcoming
          current_path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # También conservamos la metadata anterior correspondiente a esos títulos.
          if current_meta_path.exists() and previous_meta_path.exists():
              current_meta = json.loads(current_meta_path.read_text(encoding="utf-8"))
              previous_meta = json.loads(previous_meta_path.read_text(encoding="utf-8"))
              existing = current_meta.get("movies") or []
              previous_by_title = {}
              for item in previous_meta.get("movies") or []:
                  for value in [item.get("title"), *(item.get("match") or [])]:
                      if value:
                          previous_by_title[str(value).strip().lower()] = item

              for upcoming in previous_upcoming:
                  title = str(upcoming.get("title") or "").strip().lower()
                  item = previous_by_title.get(title)
                  if item and not any(
                      str(x.get("title") or "").strip().lower() == title
                      for x in existing
                  ):
                      existing.append(item)

              current_meta["movies"] = existing
              current_meta.setdefault("summary", {})["proximos_estrenos_conservados"] = len(previous_upcoming)
              current_meta_path.write_text(json.dumps(current_meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validar cartelera Cinemacenter
        id: validate_cinemacenter
        if: steps.cinemacenter.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          p = Path(".tmp/cinemacenter/cine_cinemacenter_tucuman.json")
          if not p.exists():
              sys.exit("ERROR: no se generó cine_cinemacenter_tucuman.json")

          try:
              data = json.loads(p.read_text(encoding="utf-8"))
          except Exception as exc:
              sys.exit(f"ERROR: JSON inválido: {exc}")

          cartelera = data.get("cartelera") or {}
          week_start = cartelera.get("week_start")
          week_end = cartelera.get("week_end")
          movies = cartelera.get("movies") or []
          today = datetime.now(
              ZoneInfo("America/Argentina/Tucuman")
          ).date().isoformat()

          print(f"Fecha Tucumán: {today}")
          print(f"Semana: {week_start} -> {week_end}")
          print(f"Películas: {len(movies)}")

          if not week_start or not week_end:
              sys.exit("ERROR: falta week_start/week_end")

          if week_end < today:
              sys.exit("ERROR: cartelera vencida")

          if not movies:
              Path(".tmp/cinemacenter/KEEP_PREVIOUS").write_text(
                  "cartelera vacía\n", encoding="utf-8"
              )
              sys.exit(0)

          missing = [
              m.get("title") or "(sin título)"
              for m in movies
              if not isinstance(m.get("metadata"), dict)
          ]
          if missing:
              print("ADVERTENCIA: metadata incompleta:")
              for title in missing:
                  print(f" - {title}")
              sys.exit("No se publica una cartelera parcialmente enriquecida")

          print("✓ Cartelera aceptada")
          PY

      - name: Generar evento semanal de estrenos
        id: cine_estrenos_evento
        if: steps.validate_agenda.outcome == 'success' && steps.validate_cinemacenter.outcome == 'success'
        continue-on-error: true
        run: |
          if [ -f ".tmp/cinemacenter/KEEP_PREVIOUS" ]; then
            echo "Se conserva la cartelera anterior."
            exit 0
          fi

          python scripts/generar_evento_estrenos_cine.py \
            --agenda datos/agenda_eventos.json \
            --cinema-current .tmp/cinemacenter/cine_cinemacenter_tucuman.json \
            --cinema-previous datos/cine_cinemacenter_tucuman.json

      - name: Publicar Cinemacenter
        if: steps.validate_cinemacenter.outcome == 'success'
        run: |
          if [ -f ".tmp/cinemacenter/KEEP_PREVIOUS" ]; then
            echo "Cartelera vacía: se conserva la anterior."
          elif [ -f ".tmp/cinemacenter/cine_cinemacenter_tucuman.json" ]; then
            cp .tmp/cinemacenter/cine_cinemacenter_tucuman.json \
               datos/cine_cinemacenter_tucuman.json
            echo "✓ Cinemacenter actualizado."
          fi

      - name: Publicar metadata Cinemacenter
        if: steps.validate_cinemacenter.outcome == 'success'
        run: |
          if [ -f ".tmp/cinemacenter/KEEP_PREVIOUS" ]; then
            exit 0
          fi

          if [ -f ".tmp/cinemacenter/cine_metadata.json" ]; then
            cp .tmp/cinemacenter/cine_metadata.json datos/cine_metadata.json
            mkdir -p src/data

            if [ -f "datos/cine_cinemacenter_tucuman.json" ]; then
              cp datos/cine_cinemacenter_tucuman.json \
                 src/data/cine_cinemacenter_tucuman.json
            fi

            cp datos/cine_metadata.json src/data/cine_metadata.json
          fi

      # ============================================================
      # VALIDACIÓN GENERAL
      # ============================================================
      - name: Validar JSON publicados
        id: json_validation
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          files = [
              "datos/agenda_eventos.json",
              "datos/cine_tucuman.json",
              "datos/radio_tucuman.json",
              "datos/cine_cinemacenter_tucuman.json",
              "datos/cine_metadata.json",
              "src/data/cine_cinemacenter_tucuman.json",
              "src/data/cine_metadata.json",
          ]

          failed = False
          for filename in files:
              p = Path(filename)
              if not p.exists():
                  print(f"⚠ {filename}: no existe; se conserva lo anterior.")
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8"))
                  print(f"✓ {filename}: JSON válido")
              except Exception as exc:
                  print(f"✗ {filename}: {exc}")
                  failed = True

          if failed:
              sys.exit(1)
          PY

      # ============================================================
      # COMMIT
      # ============================================================
      - name: Guardar cambios
        if: steps.json_validation.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datos/ src/data/cine_cinemacenter_tucuman.json src/data/cine_metadata.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar datos de Agenda Tucumán"
            git push
            echo "✓ Datos publicados."
          fi

      # ============================================================
      # ESTADO FINAL
      # ============================================================
      - name: Estado final
        if: always()
        run: |
          echo "============================================================"
          echo "ESTADO FINAL"
          echo "============================================================"

          if [ "${{ steps.agenda.outcome }}" = "success" ]; then
            echo "✓ Agenda: OK"
          else
            echo "⚠ Agenda: no actualizada; se conserva la anterior"
          fi

          if [ "${{ steps.radio.outcome }}" = "success" ]; then
            echo "✓ Radio/Contenidos: OK"
          else
            echo "⚠ Radio/Contenidos: no actualizado"
          fi

          if [ "${{ steps.cinemacenter.outcome }}" = "success" ] && \
             [ "${{ steps.validate_cinemacenter.outcome }}" = "success" ]; then
            echo "✓ Cinemacenter: OK"
          else
            echo "⚠ Cinemacenter: fallo o respuesta inválida"
            echo "  Se conserva la cartelera anterior."
          fi

          echo "============================================================"

          # Solo Agenda o la validación general son errores críticos.
          # Cinemacenter, Radio y Gemini tienen fallback y no deben
          # impedir que los demás datos se publiquen.
          if [ "${{ steps.agenda.outcome }}" != "success" ] || \
             [ "${{ steps.json_validation.outcome }}" != "success" ]; then
            exit 1
          fi
