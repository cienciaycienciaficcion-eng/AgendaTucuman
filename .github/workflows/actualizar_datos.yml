name: Actualizar datos Agenda Tucumán

on:
  workflow_dispatch:
  schedule:
    # Cada 6 horas. GitHub usa UTC.
    - cron: "17 */6 * * *"

permissions:
  contents: write

env:
  TZ: America/Argentina/Tucuman

jobs:
  actualizar:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r extractores/requirements.txt

      # ============================================================
      # AGENDA
      # ============================================================

      - name: Extraer agenda MEC
        id: agenda
        continue-on-error: true
        run: |
          mkdir -p .tmp/agenda

          YEAR=$(TZ=America/Argentina/Tucuman date +%Y)
          MONTH=$(TZ=America/Argentina/Tucuman date +%m)

          python extractores/agenda_mec.py \
            --start-year "$YEAR" \
            --start-month "$MONTH" \
            --months 12 \
            --lookback-months 2 \
            --delay 0.15 \
            --out .tmp/agenda

      - name: Validar agenda antes de publicar
        id: validate_agenda
        if: steps.agenda.outcome == 'success'
        run: |
          python - <<'PY2'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          ARGENTINA_TZ = ZoneInfo("America/Argentina/Tucuman")

          import json
          import sys
          from datetime import date
          from pathlib import Path

          path = Path('.tmp/agenda/agenda_eventos.json')
          if not path.exists():
              print('ERROR: el extractor no generó agenda_eventos.json.')
              sys.exit(1)

          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'ERROR: agenda_eventos.json no es JSON válido: {exc}')
              sys.exit(1)

          if not isinstance(data, list):
              print('ERROR: agenda_eventos.json no contiene una lista.')
              sys.exit(1)

          today = datetime.now(ZoneInfo("America/Argentina/Tucuman")).date().isoformat()
          valid = []
          for event in data:
              if not isinstance(event, dict):
                  continue
              end = event.get('date_end') or event.get('date_start')
              if end and end >= today:
                  valid.append(event)

          print(f'Eventos extraídos: {len(data)}')
          print(f'Eventos vigentes/futuros: {len(valid)}')
          print(f'Fecha del runner: {today}')

          if not data:
              print('ERROR: el extractor devolvió una agenda vacía.')
              print('No se reemplazarán los datos publicados anteriormente.')
              sys.exit(1)

          if not valid:
              print('ERROR: no hay eventos vigentes o futuros en la extracción.')
              print('No se reemplazarán los datos publicados anteriormente.')
              sys.exit(1)

          print('✓ Agenda aceptada para publicación.')
          PY2

      - name: Generar resúmenes con Gemini
        id: gemini
        if: steps.validate_agenda.outcome == 'success'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          if [ -f ".tmp/agenda/agenda_eventos.json" ]; then
            python scripts/generar_resumenes_gemini.py \
              --input .tmp/agenda/agenda_eventos.json \
              --previous datos/agenda_eventos.json \
              --output .tmp/agenda/agenda_eventos.json
          else
            echo "ERROR: no existe el JSON de agenda para enriquecer."
            exit 1
          fi

      - name: Publicar agenda
        if: steps.validate_agenda.outcome == 'success'
        run: |
          if [ -f ".tmp/agenda/agenda_eventos.json" ]; then
            cp .tmp/agenda/agenda_eventos.json datos/agenda_eventos.json
            echo "✓ Agenda actualizada correctamente."
          else
            echo "ERROR: el extractor terminó correctamente pero no generó agenda_eventos.json."
            exit 1
          fi

      - name: Informar estado de Gemini
        if: steps.validate_agenda.outcome == 'success'
        run: |
          if [ "${{ steps.gemini.outcome }}" = "success" ]; then
            echo "✓ Resúmenes Gemini: procesados."
          else
            echo "⚠ Resúmenes Gemini: hubo errores; se publican los datos de agenda igualmente."
          fi

      - name: Informar error de agenda
        if: steps.agenda.outcome != 'success' || steps.validate_agenda.outcome != 'success'
        run: |
          if [ "${{ steps.agenda.outcome }}" != "success" ]; then
            echo "ERROR: no se pudo actualizar la agenda."
          else
            echo "ERROR: la agenda extraída no superó la validación."
          fi
          echo "Se conservarán los datos anteriores."


      # ============================================================
      # RADIO / CONTENIDOS
      # ============================================================

      - name: Extraer contenidos y radio
        id: radio
        continue-on-error: true
        run: |
          mkdir -p .tmp/contenidos
          cd .tmp/contenidos

          python ../../extractores/contenidos.py

      - name: Validar y publicar radio/contenidos
        if: steps.radio.outcome == 'success'
        run: |
          if [ -f ".tmp/contenidos/radio_tucuman.json" ]; then
            cp .tmp/contenidos/radio_tucuman.json datos/radio_tucuman.json
            echo "Radio actualizada correctamente."
          else
            echo "ADVERTENCIA: no se generó radio_tucuman.json."
          fi

      - name: Publicar cine de Agenda
        if: steps.radio.outcome == 'success'
        run: |
          if [ -f ".tmp/contenidos/cine_tucuman.json" ]; then
            cp .tmp/contenidos/cine_tucuman.json datos/cine_tucuman.json
            echo "Cine de Agenda actualizado correctamente."
          else
            echo "ADVERTENCIA: no se generó cine_tucuman.json."
          fi

      - name: Informar error de radio
        if: steps.radio.outcome != 'success'
        run: |
          echo "ADVERTENCIA: no se pudo actualizar Radio/Contenidos."
          echo "Se conservarán los datos anteriores."

      # ============================================================
      # CINEMACENTER
      # ============================================================

      - name: Extraer Cinemacenter Tucumán
        id: cinemacenter
        continue-on-error: true
        run: |
          mkdir -p .tmp/cinemacenter
          cd .tmp/cinemacenter

          PYTHONUNBUFFERED=1 python -u ../../extractores/cinemacenter.py

      - name: Validar cartelera Cinemacenter
        id: validate_cinemacenter
        if: steps.cinemacenter.outcome == 'success'
        run: |
          python - <<'PY2'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          ARGENTINA_TZ = ZoneInfo("America/Argentina/Tucuman")

          import json
          import sys
          from datetime import date
          from pathlib import Path

          path = Path('.tmp/cinemacenter/cine_cinemacenter_tucuman.json')
          if not path.exists():
              print('ERROR: no se generó cine_cinemacenter_tucuman.json.')
              sys.exit(1)

          data = json.loads(path.read_text(encoding='utf-8'))
          cartelera = data.get('cartelera') or {}
          week_start = cartelera.get('week_start')
          week_end = cartelera.get('week_end')
          movies = cartelera.get('movies') or []
          today = datetime.now(ZoneInfo("America/Argentina/Tucuman")).date().isoformat()

          print(f'Fecha del runner: {today}')
          print(f'Semana detectada: {week_start} -> {week_end}')
          print(f'Películas detectadas: {len(movies)}')

          if not week_start or not week_end:
              print('ERROR: la cartelera no contiene week_start/week_end.')
              sys.exit(1)

          if week_end < today:
              print('ERROR: Cinemacenter devolvió una cartelera vencida.')
              print('No se reemplazarán los datos publicados anteriormente.')
              sys.exit(1)

          # Una cartelera sin películas se considera una respuesta incompleta.
          # No borramos una cartelera válida por un fallo puntual del extractor.
          if not movies:
              print('ADVERTENCIA: Cinemacenter devolvió una cartelera sin películas.')
              print('No se reemplazará la cartelera anterior.')
              with open('.tmp/cinemacenter/KEEP_PREVIOUS', 'w', encoding='utf-8') as f:
                  f.write('1\n')
              sys.exit(0)

          missing_metadata = [m.get('title') or '(sin título)' for m in movies if not isinstance(m.get('metadata'), dict)]
          if missing_metadata:
              print(f'ERROR: {len(missing_metadata)} películas no tienen metadata oficial de Cinemacenter:')
              for title in missing_metadata:
                  print(f'  - {title}')
              print('No se publicará una cartelera parcialmente enriquecida.')
              sys.exit(1)

          print(f'Metadata oficial disponible para {len(movies)}/{len(movies)} películas.')

          for movie in movies:
              title = movie.get('title') or '(sin título)'
              print(f'  - {title}')

          print(f'✓ Cartelera aceptada: {len(movies)} películas.')
          PY2

      - name: Generar evento semanal de estrenos de cine
        id: cine_estrenos_evento
        if: steps.validate_agenda.outcome == 'success' && steps.cinemacenter.outcome == 'success' && steps.validate_cinemacenter.outcome == 'success'
        run: |
          if [ -f ".tmp/cinemacenter/KEEP_PREVIOUS" ]; then
            echo "No se genera evento de estrenos porque se conserva la cartelera anterior."
            exit 0
          fi

          python scripts/generar_evento_estrenos_cine.py \
            --agenda datos/agenda_eventos.json \
            --cinema-current .tmp/cinemacenter/cine_cinemacenter_tucuman.json \
            --cinema-previous datos/cine_cinemacenter_tucuman.json

      - name: Publicar Cinemacenter
        if: steps.cinemacenter.outcome == 'success' && steps.validate_cinemacenter.outcome == 'success'
        run: |
          if [ -f ".tmp/cinemacenter/KEEP_PREVIOUS" ]; then
            echo "No se publica una cartelera vacía; se conserva la cartelera anterior."
          elif [ -f ".tmp/cinemacenter/cine_cinemacenter_tucuman.json" ]; then
            cp .tmp/cinemacenter/cine_cinemacenter_tucuman.json datos/cine_cinemacenter_tucuman.json
            echo "Cinemacenter actualizado correctamente."
          else
            echo "ADVERTENCIA: no se generó cine_cinemacenter_tucuman.json."
          fi

      - name: Informar estado de Cinemacenter
        if: steps.cinemacenter.outcome != 'success' || steps.validate_cinemacenter.outcome != 'success'
        run: |
          if [ "${{ steps.cinemacenter.outcome }}" != "success" ]; then
            echo "ADVERTENCIA: Cinemacenter no respondió."
          else
            echo "ADVERTENCIA: la cartelera obtenida no fue aceptada."
          fi
          echo "Se conservará la cartelera anterior."

      # ============================================================
      # SINCRONIZAR DATOS DE CINE PARA LA APP
      # El extractor de Cinemacenter ya genera cartelera + metadata
      # en una única ejecución. No hay workflow de enrichment separado.
      # ============================================================

      - name: Publicar metadata Cinemacenter generada
        if: steps.validate_cinemacenter.outcome == 'success'
        run: |
          if [ -f ".tmp/cinemacenter/KEEP_PREVIOUS" ]; then
            echo "No se publica metadata porque la cartelera anterior se conserva."
            exit 0
          fi
          if [ -f ".tmp/cinemacenter/cine_metadata.json" ]; then
            cp .tmp/cinemacenter/cine_metadata.json datos/cine_metadata.json
            echo "Metadata Cinemacenter publicada."
          else
            echo "ERROR: no se generó cine_metadata.json."
            exit 1
          fi

          if [ -f "datos/cine_cinemacenter_tucuman.json" ]; then
            cp datos/cine_cinemacenter_tucuman.json src/data/cine_cinemacenter_tucuman.json
          fi
          cp datos/cine_metadata.json src/data/cine_metadata.json

          python - <<'PY2'
          import json
          from pathlib import Path
          data = json.loads(Path("datos/cine_metadata.json").read_text(encoding="utf-8"))
          summary = data.get("summary", {})
          print(f"Metadata Cinemacenter: {summary.get('complete_source', 0)} completas desde fuente; {summary.get('partial_source', 0)} parciales; {summary.get('without_metadata', 0)} sin metadata.")
          PY2

      # ============================================================
      # VALIDACIÓN GENERAL DE JSON PUBLICADOS
      # ============================================================

      - name: Validar JSON publicados
        id: json_validation
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          files = [
              "datos/agenda_eventos.json",
              "datos/cine_tucuman.json",
              "datos/radio_tucuman.json",
              "datos/cine_cinemacenter_tucuman.json",
              "datos/cine_metadata.json",
              "src/data/cine_cinemacenter_tucuman.json",
              "src/data/cine_metadata.json",
          ]

          failed = False

          print("")
          print("=" * 70)
          print("VALIDACIÓN DE JSON PUBLICADOS")
          print("=" * 70)

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  print(f"⚠ {filename}: no existe; se conserva la versión anterior.")
                  continue

              try:
                  with path.open(encoding="utf-8") as f:
                      data = json.load(f)

                  print(f"✓ {filename}: JSON válido")

                  if filename.endswith("agenda_eventos.json") and isinstance(data, list):
                      print(f"  Eventos publicados: {len(data)}")
              except Exception as e:
                  print(f"✗ {filename}: ERROR - {e}")
                  failed = True

          if failed:
              sys.exit(1)

          print("=" * 70)
          PY

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Guardar cambios
        if: steps.json_validation.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datos/ src/data/cine_cinemacenter_tucuman.json src/data/cine_metadata.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos en los datos."
          else
            git commit -m "Actualizar datos de Agenda Tucumán"
            git push
            echo "Datos publicados correctamente."
          fi

      # ============================================================
      # FALLAR EL WORKFLOW SI HUBO UN PROBLEMA CRÍTICO
      # Esto hace que GitHub lo marque como FAILED y active las
      # notificaciones normales de GitHub Actions.
      # ============================================================

      - name: Estado final
        if: always()
        run: |
          echo ""
          echo "============================================================"
          echo "ESTADO FINAL"
          echo "============================================================"

          if [ "${{ steps.agenda.outcome }}" = "success" ]; then
            echo "✓ Agenda MEC: OK"
          else
            echo "✗ Agenda MEC: ERROR"
          fi

          if [ "${{ steps.radio.outcome }}" = "success" ]; then
            echo "✓ Radio/Contenidos: OK"
          else
            echo "⚠ Radio/Contenidos: no actualizado"
          fi

          if [ "${{ steps.cinemacenter.outcome }}" = "success" ] && [ "${{ steps.validate_cinemacenter.outcome }}" = "success" ]; then
            echo "✓ Cinemacenter: OK y cartelera vigente"
          else
            echo "⚠ Cinemacenter: no actualizado / cartelera anterior conservada"
          fi

          if [ "${{ steps.cinemacenter.outcome }}" = "success" ]; then
            echo "✓ Metadata Cinemacenter: generada por el mismo extractor"
          else
            echo "⚠ Metadata Cinemacenter: no generada porque Cinemacenter no se actualizó"
          fi

          echo ""
          echo "Si un extractor falla, se conservan sus datos anteriores."
          echo "La Agenda se publica exactamente con el resultado generado por el extractor."
          echo "============================================================"

          if [ "${{ steps.agenda.outcome }}" != "success" ] || \
             [ "${{ steps.json_validation.outcome }}" != "success" ]; then
            exit 1
          fi
