name: Actualizar datos Agenda Tucumán

on:
  workflow_dispatch:
  schedule:
    # Cada 6 horas. GitHub usa UTC.
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r extractores/requirements.txt

      - name: Extraer agenda MEC
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)
          python extractores/agenda_mec.py \
            --start-year "$YEAR" \
            --start-month "$MONTH" \
            --months 12 \
            --delay 0.15 \
            --out .tmp/agenda

      - name: Extraer contenidos y radio
        run: |
          mkdir -p .tmp/contenidos
          cd .tmp/contenidos
          python ../../extractores/contenidos.py

      - name: Extraer Cinemacenter Tucumán
        run: |
          mkdir -p .tmp/cinemacenter
          cd .tmp/cinemacenter
          python ../../extractores/cinemacenter.py

      - name: Publicar JSON
        run: |
          cp .tmp/agenda/agenda_eventos.json datos/agenda_eventos.json
          cp .tmp/contenidos/radio_tucuman.json datos/radio_tucuman.json
          cp .tmp/contenidos/cine_tucuman.json datos/cine_tucuman.json
          cp .tmp/cinemacenter/cine_cinemacenter_tucuman.json datos/cine_cinemacenter_tucuman.json

      - name: Validar JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [
              "datos/agenda_eventos.json",
              "datos/radio_tucuman.json",
              "datos/cine_tucuman.json",
              "datos/cine_cinemacenter_tucuman.json",
          ]
          for f in files:
              p = Path(f)
              with p.open(encoding="utf-8") as fh:
                  data = json.load(fh)
              print(f"{f}: OK")
              if f.endswith("agenda_eventos.json"):
                  print("  eventos:", len(data))
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "No hay cambios en los datos."
          else
            git commit -m "Actualizar datos de Agenda Tucumán"
            git push
          fi
