name: Actualizar datos Agenda Tucumán

on:
  workflow_dispatch:
  schedule:
    # Cada 6 horas. GitHub usa UTC.
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r extractores/requirements.txt

      # ============================================================
      # AGENDA
      # ============================================================

      - name: Extraer agenda MEC
        id: agenda
        continue-on-error: true
        run: |
          mkdir -p .tmp/agenda

          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)

          python extractores/agenda_mec.py \
            --start-year "$YEAR" \
            --start-month "$MONTH" \
            --months 12 \
            --lookback-months 2 \
            --delay 0.15 \
            --out .tmp/agenda

      - name: Publicar agenda
        if: steps.agenda.outcome == 'success'
        run: |
          if [ -f ".tmp/agenda/agenda_eventos.json" ]; then
            cp .tmp/agenda/agenda_eventos.json datos/agenda_eventos.json
            echo "Agenda actualizada correctamente."
          else
            echo "ADVERTENCIA: el extractor no generó agenda_eventos.json."
          fi

      - name: Informar error de agenda
        if: steps.agenda.outcome != 'success'
        run: |
          echo "ADVERTENCIA: no se pudo actualizar la agenda."
          echo "Se conservarán los datos anteriores."


      - name: Diagnóstico y validación de Agenda
        id: validate
        continue-on-error: true
        if: steps.agenda.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          errors = []
          warnings = []

          generated = Path(".tmp/agenda/agenda_eventos.json")
          previous = Path("datos/agenda_eventos.json")

          print("")
          print("=" * 72)
          print("DIAGNÓSTICO AGENDA TUCUMÁN")
          print("=" * 72)

          if not generated.exists():
              errors.append("El extractor NO generó .tmp/agenda/agenda_eventos.json.")
              data = []
          else:
              try:
                  data = json.loads(generated.read_text(encoding="utf-8"))
                  if not isinstance(data, list):
                      errors.append("El JSON generado no contiene una lista de eventos.")
                      data = []
              except Exception as e:
                  errors.append(f"El JSON generado es inválido: {e}")
                  data = []

          new_count = len(data)

          old_count = 0
          if previous.exists():
              try:
                  old = json.loads(previous.read_text(encoding="utf-8"))
                  if isinstance(old, list):
                      old_count = len(old)
              except Exception as e:
                  warnings.append(f"No se pudo leer la versión anterior: {e}")

          print(f"Eventos anteriores : {old_count}")
          print(f"Eventos nuevos     : {new_count}")
          print("")

          if new_count == 0:
              errors.append(
                  "El extractor generó 0 eventos. Posible cambio en la "
                  "API/estructura de Agenda Tucumán."
              )

          if old_count > 20 and new_count < max(5, int(old_count * 0.20)):
              errors.append(
                  f"Caída anómala: {old_count} -> {new_count} eventos "
                  f"(menos del 20% de la versión anterior)."
              )
          elif old_count > 0 and new_count < int(old_count * 0.50):
              warnings.append(
                  f"Los eventos bajaron notablemente: {old_count} -> {new_count}."
              )

          bad = 0
          for item in data:
              if not isinstance(item, dict) or not item.get("title") or not item.get("link"):
                  bad += 1

          if bad:
              errors.append(f"{bad} eventos no tienen título o enlace.")

          if warnings:
              print("ADVERTENCIAS:")
              for warning in warnings:
                  print(f"  ⚠ {warning}")
              print("")

          if errors:
              print("ERRORES CRÍTICOS:")
              for error in errors:
                  print(f"  ✗ {error}")
              print("")
              print("ACCIÓN:")
              print("  ✗ NO reemplazar datos anteriores.")
              print("  ✓ Mantener la última versión válida.")
              print("  ✗ Marcar el workflow como FAILED.")
              print("=" * 72)
              sys.exit(1)

          print("RESULTADO:")
          print("  ✓ Agenda validada correctamente.")
          print("  ✓ Los datos pueden publicarse.")
          print("=" * 72)
          PY

      - name: Publicar agenda validada
        if: steps.agenda.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          cp .tmp/agenda/agenda_eventos.json datos/agenda_eventos.json
          echo "✓ Agenda validada y publicada."

      - name: Informar fallo de validación de Agenda
        if: steps.validate.outcome == 'failure' || steps.agenda.outcome != 'success'
        run: |
          echo ""
          echo "🚨 ALERTA: actualización de Agenda Tucumán FALLIDA."
          echo "Los datos anteriores se conservarán."
          echo "Revisar el paso 'Diagnóstico y validación de Agenda'."
          echo ""

      # ============================================================
      # RADIO / CONTENIDOS
      # ============================================================

      - name: Extraer contenidos y radio
        id: radio
        continue-on-error: true
        run: |
          mkdir -p .tmp/contenidos
          cd .tmp/contenidos

          python ../../extractores/contenidos.py

      - name: Validar y publicar radio/contenidos
        if: steps.radio.outcome == 'success'
        run: |
          if [ -f ".tmp/contenidos/radio_tucuman.json" ]; then
            cp .tmp/contenidos/radio_tucuman.json datos/radio_tucuman.json
            echo "Radio actualizada correctamente."
          else
            echo "ADVERTENCIA: no se generó radio_tucuman.json."
          fi

      - name: Publicar cine de Agenda
        if: steps.radio.outcome == 'success'
        run: |
          if [ -f ".tmp/contenidos/cine_tucuman.json" ]; then
            cp .tmp/contenidos/cine_tucuman.json datos/cine_tucuman.json
            echo "Cine de Agenda actualizado correctamente."
          else
            echo "ADVERTENCIA: no se generó cine_tucuman.json."
          fi

      - name: Informar error de radio
        if: steps.radio.outcome != 'success'
        run: |
          echo "ADVERTENCIA: no se pudo actualizar Radio/Contenidos."
          echo "Se conservarán los datos anteriores."

      # ============================================================
      # CINEMACENTER
      # ============================================================

      - name: Extraer Cinemacenter Tucumán
        id: cinemacenter
        continue-on-error: true
        run: |
          mkdir -p .tmp/cinemacenter
          cd .tmp/cinemacenter

          python ../../extractores/cinemacenter.py

      - name: Publicar Cinemacenter
        if: steps.cinemacenter.outcome == 'success'
        run: |
          if [ -f ".tmp/cinemacenter/cine_cinemacenter_tucuman.json" ]; then
            cp .tmp/cinemacenter/cine_cinemacenter_tucuman.json datos/cine_cinemacenter_tucuman.json
            echo "Cinemacenter actualizado correctamente."
          else
            echo "ADVERTENCIA: no se generó cine_cinemacenter_tucuman.json."
          fi

      - name: Informar error de Cinemacenter
        if: steps.cinemacenter.outcome != 'success'
        run: |
          echo "ADVERTENCIA: Cinemacenter no respondió."
          echo "Se conservará la cartelera anterior."

      # ============================================================
      # VALIDACIÓN GENERAL DE JSON PUBLICADOS
      # ============================================================

      - name: Validar JSON publicados
        id: json_validation
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          files = [
              "datos/agenda_eventos.json",
              "datos/cine_tucuman.json",
              "datos/radio_tucuman.json",
              "datos/cine_cinemacenter_tucuman.json",
          ]

          failed = False

          print("")
          print("=" * 70)
          print("VALIDACIÓN DE JSON PUBLICADOS")
          print("=" * 70)

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  print(f"⚠ {filename}: no existe; se conserva la versión anterior.")
                  continue

              try:
                  with path.open(encoding="utf-8") as f:
                      data = json.load(f)

                  print(f"✓ {filename}: JSON válido")

                  if filename.endswith("agenda_eventos.json") and isinstance(data, list):
                      print(f"  Eventos publicados: {len(data)}")
              except Exception as e:
                  print(f"✗ {filename}: ERROR - {e}")
                  failed = True

          if failed:
              sys.exit(1)

          print("=" * 70)
          PY

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Guardar cambios
        if: steps.validate.outcome == 'success' && steps.json_validation.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datos/

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos en los datos."
          else
            git commit -m "Actualizar datos de Agenda Tucumán"
            git push
            echo "Datos publicados correctamente."
          fi

      # ============================================================
      # FALLAR EL WORKFLOW SI HUBO UN PROBLEMA CRÍTICO
      # Esto hace que GitHub lo marque como FAILED y active las
      # notificaciones normales de GitHub Actions.
      # ============================================================

      - name: Estado final
        if: always()
        run: |
          echo ""
          echo "============================================================"
          echo "ESTADO FINAL"
          echo "============================================================"

          if [ "${{ steps.agenda.outcome }}" != "success" ]; then
            echo "✗ Agenda MEC: ERROR"
          elif [ "${{ steps.validate.outcome }}" != "success" ]; then
            echo "✗ Agenda MEC: ANOMALÍA DETECTADA"
          else
            echo "✓ Agenda MEC: OK"
          fi

          if [ "${{ steps.radio.outcome }}" = "success" ]; then
            echo "✓ Radio/Contenidos: OK"
          else
            echo "⚠ Radio/Contenidos: no actualizado"
          fi

          if [ "${{ steps.cinemacenter.outcome }}" = "success" ]; then
            echo "✓ Cinemacenter: OK"
          else
            echo "⚠ Cinemacenter: no actualizado"
          fi

          echo ""
          echo "Los datos que no pudieron actualizarse conservan"
          echo "la versión anterior del repositorio."
          echo "============================================================"

          if [ "${{ steps.agenda.outcome }}" != "success" ] || \
             [ "${{ steps.validate.outcome }}" != "success" ] || \
             [ "${{ steps.json_validation.outcome }}" != "success" ]; then
            exit 1
          fi
