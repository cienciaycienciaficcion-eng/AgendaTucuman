name: Actualizar metadata de cine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich-cine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Actualizar metadata exclusivamente desde Cinemacenter
        env:
          CINEMACENTER_FETCH_MODE: auto
          CINEMACENTER_READER_TIMEOUT: '60'
          PYTHONUNBUFFERED: '1'
        run: python scripts/enrich-cinemacenter-metadata.py

      - name: Validar metadata generada
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('datos/cine_metadata.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          movies = data.get('movies') or []
          summary = data.get('summary') or {}

          print('==============================================')
          print('RESUMEN DE METADATA CINEMACENTER')
          print('==============================================')
          print(f"Películas: {len(movies)}")
          print(f"Completas: {summary.get('complete', 0)}")
          print(f"Parciales: {summary.get('partial', 0)}")
          print(f"Fichas exactas: {summary.get('resolved_this_run', 0)}")
          print('')

          for movie in movies:
              title = movie.get('title') or 'SIN TITULO'
              status = movie.get('metadata_status', 'unknown')
              missing = ', '.join(movie.get('metadata_missing') or []) or 'ninguno'
              print(f"- {title}: {status}; faltan: {missing}")
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datos/cine_metadata.json \
                  src/data/cine_metadata.json \
                  datos/cine_cinemacenter_tucuman.json \
                  src/data/cine_cinemacenter_tucuman.json

          if git diff --cached --quiet; then
            echo "Sin cambios de metadata."
          else
            git commit -m "Actualizar metadata exclusivamente desde Cinemacenter"
            git push
          fi
