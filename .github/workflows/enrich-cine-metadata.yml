name: Actualizar metadata de cine

on:
  workflow_dispatch:
  schedule:
    - cron: '20 */6 * * *'

permissions:
  contents: write

jobs:
  enrich-cine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Actualizar metadata desde Cinemacenter
        env:
          # Cinemacenter puede bloquear o ralentizar el acceso desde GitHub.
          # Jina Reader accede a la página y devuelve su contenido; la fuente
          # de los datos sigue siendo Cinemacenter.
          CINEMACENTER_FETCH_MODE: jina
          CINEMACENTER_READER_TIMEOUT: '60'
          PYTHONUNBUFFERED: '1'
        run: python scripts/enrich-cinemacenter-metadata.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cine_metadata.json src/data/cine_cinemacenter_tucuman.json datos/cine_metadata.json datos/cine_cinemacenter_tucuman.json
          if git diff --cached --quiet; then
            echo "Sin cambios de metadata."
          else
            git commit -m "Actualizar metadata de películas desde Cinemacenter"
            git push
          fi
